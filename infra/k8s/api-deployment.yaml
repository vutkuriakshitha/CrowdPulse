apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigilanttwin-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vigilanttwin-api
  template:
    metadata:
      labels:
        app: vigilanttwin-api
    spec:
      containers:
        - name: api
          image: vigilanttwin/api:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vt-secrets
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: vt-secrets
                  key: redis_url
---
apiVersion: v1
kind: Service
metadata:
  name: vigilanttwin-api
spec:
  selector:
    app: vigilanttwin-api
  ports:
    - port: 80
      targetPort: 8000
